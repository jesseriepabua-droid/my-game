<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Egg Shockers 3D — Multiplayer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- LOBBY OVERLAY -->
  <div id="lobby">
    <div class="lobby-card">
      <h1>EGG SHOCKERS 3D</h1>
      <p class="subtitle">Multiplayer Arena • 3-Minute Timed Match</p>

      <div class="input-group">
        <label>Your Egg Name</label>
        <input type="text" id="playerName" placeholder="Enter nickname..." maxlength="14" value="EggWarrior" />
      </div>

      <div class="input-group">
        <label>Shell Color</label>
        <div class="color-picker" id="colorPicker">
          <button class="color-btn active" data-color="#ff5252" style="background:#ff5252"></button>
          <button class="color-btn" data-color="#448aff" style="background:#448aff"></button>
          <button class="color-btn" data-color="#69f0ae" style="background:#69f0ae"></button>
          <button class="color-btn" data-color="#ffd740" style="background:#ffd740"></button>
          <button class="color-btn" data-color="#e040fb" style="background:#e040fb"></button>
          <button class="color-btn" data-color="#ffffff" style="background:#ffffff"></button>
        </div>
      </div>

      <div class="actions">
        <button id="createBtn" class="btn primary">Create New Room</button>
        <div class="divider"><span>OR JOIN WITH CODE</span></div>
        <div class="join-row">
          <input type="text" id="roomCodeInput" placeholder="4-LETTER CODE" maxlength="4" />
          <button id="joinBtn" class="btn secondary">Join Room</button>
        </div>
      </div>

      <p id="errorMsg" class="error"></p>
      <p class="controls-hint">Controls: <b>WASD</b> Move • <b>SPACE</b> Jump • <b>Click</b> Shoot • <b>R</b> Reload</p>
    </div>
  </div>

  <!-- IN-GAME HUD -->
  <div id="hud" class="hidden">
    <div class="top-bar">
      <div class="room-badge">
        ROOM CODE: <span id="displayRoomCode">----</span>
        <button id="copyCodeBtn" title="Copy Room Code">Copy</button>
      </div>
      <div class="timer-box" id="timerDisplay">03:00</div>
      <div class="scoreboard" id="scoreboard"></div>
    </div>

    <div id="killFeed"></div>
    <div id="crosshair">+</div>
    <div id="clickPrompt">Click screen to lock mouse & aim</div>

    <div class="bottom-bar">
      <div class="hp-container">
        <span>SHELL HP</span>
        <div class="hp-bar-bg"><div id="hpBar" class="hp-bar-fill"></div></div>
        <span id="hpText">100</span>
      </div>
      <div class="ammo-box">
        YOLK AMMO: <span id="ammoText">12 / 12</span>
      </div>
    </div>
  </div>

  <!-- MATCH OVER MODAL -->
  <div id="matchOverModal" class="hidden">
    <div class="lobby-card">
      <h2>MATCH COMPLETE!</h2>
      <div id="finalStandings"></div>
      <p class="subtitle">Next round starting automatically in 8 seconds...</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
